<!-- Widebed AI chat box. Paste this whole block into your website's HTML / custom code element. -->
<!-- 1) Replace PASTE-THE-WEBHOOK-URL-HERE with the webhook URL you got when you published the workflow. -->
<!-- 2) mode: "floating" = chat bubble in the bottom corner, "inline" = chat window inside this section. -->
<div id="widebed-chat"></div>
<script>
  window.WidebedChat = {
    webhook: "PASTE-THE-WEBHOOK-URL-HERE",
    mode: "floating",
    title: "Widebed",
    subtitle: "We usually reply in a few seconds",
    welcome: "Hi! How can we help with your stay?",
    placeholder: "Type your message...",
    color: "#1f3a5f",
    position: "right",
    height: 520,
    container: "widebed-chat"
  };
</script>
<script>
(function () {
  'use strict';
  // Settings come from the <script data-...> tag, or from window.WidebedChat = {...} (HTML code components).
  var script = document.currentScript && document.currentScript.getAttribute('data-webhook') ? document.currentScript : document.querySelector('script[data-webhook]');
  var o = window.WidebedChat || {};
  if (window.__widebedChat) return;
  window.__widebedChat = true;
  function opt(name, attr) {
    if (o[name] !== undefined && o[name] !== null && o[name] !== '') return String(o[name]);
    return script ? script.getAttribute('data-' + attr) || '' : '';
  }

  var cfg = {
    webhook: opt('webhook', 'webhook'),
    title: opt('title', 'title') || 'Chat with us',
    subtitle: opt('subtitle', 'subtitle') || 'We usually reply in a few seconds',
    welcome: opt('welcome', 'welcome') || 'Hi! How can we help?',
    color: /^#[0-9a-f]{3,8}$/i.test(opt('color', 'color')) ? opt('color', 'color') : '#1f3a5f',
    position: opt('position', 'position') === 'left' ? 'left' : 'right',
    placeholder: opt('placeholder', 'placeholder') || 'Type your message...',
    // "floating" = chat bubble in the corner; "inline" = chat window shown inside the page section.
    mode: opt('mode', 'mode') === 'inline' ? 'inline' : 'floating',
    container: opt('container', 'container'),
    height: /^\d{3,4}$/.test(opt('height', 'height')) ? Number(opt('height', 'height')) : 520,
  };
  if (!/^https?:\/\/[^\s]+\/hooks\/[A-Za-z0-9_-]{10,}/.test(cfg.webhook)) {
    console.warn('[Widebed chat] Set the webhook URL (https://YOUR-APP/hooks/...) from publishing the workflow. Now: "' + cfg.webhook + '"');
    cfg.broken = true;
  }

  /* ---------- small storage helpers (storage can be blocked, e.g. in private mode) ---------- */
  var mem = {};
  function store(kind) {
    try {
      var s = window[kind];
      s.setItem('__wb_t', '1');
      s.removeItem('__wb_t');
      return s;
    } catch (e) {
      return { getItem: function (k) { return mem[k] || null; }, setItem: function (k, v) { mem[k] = String(v); }, removeItem: function (k) { delete mem[k]; } };
    }
  }
  var local = store('localStorage');
  var session = store('sessionStorage');
  var KEY = 'widebed-chat:' + cfg.webhook.slice(-12);
  var sessionId = local.getItem(KEY + ':id');
  if (!sessionId) {
    sessionId = 'web-' + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    local.setItem(KEY + ':id', sessionId);
  }
  var history = [];
  try { history = JSON.parse(session.getItem(KEY + ':log') || '[]') || []; } catch (e) { history = []; }

  /* ---------- UI ---------- */
  var inline = cfg.mode === 'inline';
  var host = document.createElement('div');
  var box = inline && cfg.container ? document.getElementById(cfg.container) : null;
  if (inline) {
    host.style.cssText = 'position:relative;width:100%;max-width:520px;margin:0 auto;';
    (box || (script && script.parentNode) || document.body).appendChild(host);
  } else {
    host.style.cssText = 'position:fixed;z-index:2147483000;bottom:20px;' + cfg.position + ':20px;';
    document.body.appendChild(host);
  }
  var root = host.attachShadow ? host.attachShadow({ mode: 'open' }) : host;

  var side = cfg.position;
  root.innerHTML =
    '<style>' +
    ':host,*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}' +
    '.btn{width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;background:' + cfg.color + ';color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.22);display:grid;place-items:center;transition:transform .15s}' +
    '.btn:hover{transform:scale(1.06)}.btn:focus-visible{outline:3px solid #9cc3ff;outline-offset:2px}' +
    '.panel{position:absolute;bottom:72px;' + side + ':0;width:360px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 110px);background:#fff;color:#1b1f24;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:none;flex-direction:column;overflow:hidden}' +
    '.panel.open{display:flex;animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}' +
    '.head{background:' + cfg.color + ';color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}' +
    '.head b{display:block;font-size:15px}.head span{font-size:12px;opacity:.85}.x{margin-left:auto;background:none;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}' +
    '.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#f6f7f9}' +
    '.m{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}' +
    '.bot{background:#fff;border:1px solid #e3e6ea;align-self:flex-start;border-bottom-left-radius:4px}' +
    '.me{background:' + cfg.color + ';color:#fff;align-self:flex-end;border-bottom-right-radius:4px}' +
    '.err{background:#fdecea;color:#a3271f;align-self:flex-start;font-size:13px}' +
    '.dots{align-self:flex-start;background:#fff;border:1px solid #e3e6ea;border-radius:14px;padding:10px 14px;display:none}.dots.on{display:block}' +
    '.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:#9aa3ad;animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}' +
    '@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}' +
    '.form{display:flex;gap:8px;padding:10px;border-top:1px solid #e3e6ea;background:#fff}' +
    'textarea{flex:1;resize:none;border:1px solid #d5d9de;border-radius:10px;padding:9px 10px;font-size:14px;max-height:110px;outline:none}textarea:focus{border-color:' + cfg.color + '}' +
    '.send{border:0;border-radius:10px;padding:0 14px;background:' + cfg.color + ';color:#fff;font-weight:600;cursor:pointer}.send:disabled{opacity:.5;cursor:default}' +
    (inline
      ? '.panel{position:static;display:flex;width:100%;max-width:none;height:' + cfg.height + 'px;max-height:none;box-shadow:0 4px 18px rgba(0,0,0,.12);border:1px solid #e3e6ea}.btn,.x{display:none}'
      : '@media (max-width:480px){.panel{position:fixed;inset:0;width:100%;height:100%;max-height:none;max-width:none;border-radius:0}}') +
    '</style>' +
    '<div class="panel" role="dialog" aria-label="' + esc(cfg.title) + '">' +
    '<div class="head"><div><b>' + esc(cfg.title) + '</b><span>' + esc(cfg.subtitle) + '</span></div><button class="x" aria-label="Close chat">\u00d7</button></div>' +
    '<div class="log" aria-live="polite"></div>' +
    '<div class="form"><textarea rows="1" maxlength="2000" aria-label="Your message" placeholder="' + esc(cfg.placeholder) + '"></textarea><button class="send" type="button">Send</button></div>' +
    '</div>' +
    '<button class="btn" aria-label="Open chat"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  var panel = root.querySelector('.panel');
  var log = root.querySelector('.log');

  var input = root.querySelector('textarea');
  var send = root.querySelector('.send');
  var dots = document.createElement('div');
  dots.className = 'dots';
  dots.innerHTML = '<i></i><i></i><i></i>';

  function add(kind, text, save) {
    var el = document.createElement('div');
    el.className = 'm ' + kind;
    el.textContent = text; // never HTML: replies are shown as plain text
    log.insertBefore(el, dots);
    log.scrollTop = log.scrollHeight;
    if (save) {
      history.push({ k: kind, t: text });
      history = history.slice(-40);
      session.setItem(KEY + ':log', JSON.stringify(history));
    }
  }
  log.appendChild(dots);
  add('bot', cfg.welcome, false);
  history.forEach(function (h) { add(h.k, h.t, false); });

  function toggle(open) {
    panel.classList.toggle('open', open);
    if (open) setTimeout(function () { input.focus(); }, 50);
  }
  root.querySelector('.btn').addEventListener('click', function () { toggle(!panel.classList.contains('open')); });
  root.querySelector('.x').addEventListener('click', function () { toggle(false); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });
  send.addEventListener('click', submit);

  var busy = false;
  // No <form>: page builders often run custom code in a sandboxed frame where forms are blocked.
  function submit() {
    var text = input.value.trim();
    if (!text || busy) return;
    if (cfg.broken) {
      add('err', 'This chat box is not set up yet: the webhook URL is missing.', false);
      return;
    }
    busy = true;
    send.disabled = true;
    input.value = '';
    add('me', text, true);
    dots.classList.add('on');
    log.scrollTop = log.scrollHeight;

    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 60000);
    fetch(cfg.webhook, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ message: text, sessionId: sessionId, page: location.href, title: document.title }),
      signal: ctrl ? ctrl.signal : undefined,
    })
      .then(function (res) {
        var type = res.headers.get('content-type') || '';
        return (type.indexOf('json') >= 0 ? res.json() : res.text()).then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
      })
      .then(function (r) {
        var d = r.data;
        var reply = typeof d === 'string' ? d : d && (d.reply || d.output || d.message || d.text);
        if (r.ok && r.status !== 202 && reply) add('bot', String(reply), true);
        else if (r.status === 403 && d && d.error) add('err', String(d.error), false);
        else add('err', r.status === 202 ? 'Sorry, that took too long. Please try again in a moment.' : 'Sorry, something went wrong. Please try again.', false);
      })
      .catch(function () {
        add('err', 'Sorry, we could not reach the chat. Check your connection and try again.', false);
      })
      .then(function () {
        clearTimeout(timer);
        dots.classList.remove('on');
        busy = false;
        send.disabled = false;
        input.focus();
      });
  }
})();
</script>
